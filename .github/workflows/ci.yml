name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Run CI checks
        run: task validate:ci

  rust:
    name: Rust and VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs rust (with the wasm32 target) and wasm-bindgen-cli from mise.toml.
      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Run Rust checks
        run: task rust:validate

      - name: Test the VS Code extension
        env:
          TZ: UTC
        run: task vscode:dz-review:test

      - name: Check the VS Code extension bundle
        working-directory: packages/vscode/dz-review
        run: npm run check
