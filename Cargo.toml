[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4", features = ["derive"] }
dz-encodings = { path = "crates/dz-encodings" }
md-manipulator = { path = "crates/md-manipulator" }
dz-cli-support = { path = "crates/dz-cli-support" }
critique-core = { path = "crates/critique-core" }
worklog-core = { path = "crates/worklog-core" }
markdown-surgeon-cli = { path = "crates/markdown-surgeon-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The MRFI conformance tests scan documents with SHA-256 / xxh64 windows:
# unoptimized, they take minutes.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.md-manipulator]
opt-level = 3
