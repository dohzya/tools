[package]
name = "critique-cli"
description = "Critique CLI: session state, git access and command handlers over critique-core."
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "critique_cli"
path = "src/lib.rs"

[[bin]]
name = "critique"
path = "src/main.rs"

[dependencies]
critique-core.workspace = true
md-manipulator.workspace = true
dz-cli-support.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
clap_complete = "4.6.11"
jiff = "0.2.39"

[dev-dependencies]
tempfile = "3.27.0"
