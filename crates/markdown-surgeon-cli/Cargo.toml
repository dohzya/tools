[package]
name = "markdown-surgeon-cli"
description = "Markdown section editing CLI: domain modules and command handlers."
version = "0.11.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "markdown-surgeon"
path = "src/main.rs"

[dependencies]
md-manipulator.workspace = true
dz-cli-support.workspace = true
clap.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap_complete = "4.6.11"
jiff = "0.2.39"
glob = "0.3.4"

[dev-dependencies]
tempfile = "3.27.0"
