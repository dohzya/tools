[package]
name = "md-manipulator"
description = "Markdown section tree, section ids, frontmatter and MRFI references. Performs no I/O and builds for wasm32."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dz-encodings.workspace = true
pulldown-cmark = { version = "~0.13.5", default-features = false }
sha2 = "0.10"
yaml-edit = { version = "~0.3.5", default-features = false }
thiserror = "2"
unicode-normalization = { version = "0.1", default-features = false }
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
