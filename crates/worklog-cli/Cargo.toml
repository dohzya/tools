[package]
name = "worklog-cli"
description = "Worklog CLI: command handlers, git scopes and agent launchers over worklog-core."
version = "0.21.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "worklog_cli"
path = "src/lib.rs"

[[bin]]
name = "worklog"
path = "src/main.rs"

[dependencies]
worklog-core.workspace = true
dz-cli-support.workspace = true
clap.workspace = true
clap_complete = "4.6.11"
serde.workspace = true
serde_json.workspace = true
jiff = "0.2.39"
getrandom = "0.4"
# Interactive task picker: fuzzy filter while typing, arrows, enter. Pure Rust
# on crossterm, so it works on Windows terminals too.
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }

[dev-dependencies]
tempfile = "3.27.0"
