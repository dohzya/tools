[package]
name = "recap-cli"
description = "Recap CLI: compact project context snapshot."
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "recap_cli"
path = "src/lib.rs"

[[bin]]
name = "recap"
path = "src/main.rs"

[dependencies]
dz-cli-support.workspace = true
clap.workspace = true
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# libyaml-backed parser: keeps mapping order and rejects duplicate keys, like
# the js-yaml port the TS tool relies on.
serde_yaml_ng = "0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
